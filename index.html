<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>专业网站首页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            line-height: 1.6;
        }

        /* 顶部导航 */
        header {
            background: #0f172a;
            padding: 20px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #fff;
            font-size: 24px;
        }

        nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 30px;
            font-size: 16px;
        }

        nav a:hover {
            color: #fff;
        }

        /* Banner */
        .hero {
            background: linear-gradient(120deg, #2563eb, #1e40af);
            color: #fff;
            padding: 100px 10%;
            text-align: center;
        }

        .hero h2 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            max-width: 700px;
            margin: auto;
        }

        .hero button {
            margin-top: 40px;
            padding: 15px 40px;
            font-size: 16px;
            border: none;
            border-radius: 30px;
            background: #fff;
            color: #1e40af;
            cursor: pointer;
        }

        .hero button:hover {
            background: #e5e7eb;
        }

        /* 内容区 */
        section {
            padding: 80px 10%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h3 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #666;
        }

        /* 服务卡片 */
        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
        }

        .card {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card h4 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .card p {
            color: #555;
        }

        /* 底部 */
        footer {
            background: #0f172a;
            color: #cbd5e1;
            text-align: center;
            padding: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>MyWebsite</h1>
    <nav>
        <a href="#">首页</a>
        <a href="#">服务</a>
        <a href="#">关于我们</a>
        <a href="#">联系</a>
    </nav>
</header>

<div class="hero">
    <h2>打造专业 · 可靠 · 高品质的网站</h2>
    <p>
        我们致力于为用户提供现代化、简洁、高效的网页设计方案，
        帮助您的品牌在互联网上脱颖而出。
    </p>
    <button>立即了解</button>
</div>

<section>
    <div class="section-title">
        <h3>我们的服务</h3>
        <p>为您提供全方位的解决方案</p>
    </div>

    <div class="services">
        <div class="card">
            <h4>网站设计</h4>
            <p>现代、简洁、符合用户体验的专业网页设计。</p>
        </div>

        <div class="card">
            <h4>响应式布局</h4>
            <p>完美适配手机、平板和桌面设备。</p>
        </div>

        <div class="card">
            <h4>品牌形象</h4>
            <p>统一视觉风格，提升品牌专业度与信任感。</p>
        </div>
    </div>
</section>

<footer>
    © 2025 MyWebsite. All Rights Reserved.
</footer>

</body>
</html>
